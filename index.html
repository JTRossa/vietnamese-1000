<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vietnamese 1000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, focused, a study tool you open every day
   IDEA: a lacquer-red flashcard on a quiet desk
   PICTURE: the live card: current Vietnamese word huge, English under it, progress rail
   COLOUR and TYPE: lacquer red + gold accent on white / warm near-black; Be Vietnam Pro (made for Vietnamese diacritics)
   LAYOUT: player card first, then Words / Quiz tabs, then the 50 packs as a grid */
:root{color-scheme:light dark;--bg:light-dark(#fff,#16100f);--ink:light-dark(#1c1412,#f4ece8);--mut:light-dark(#6d605b,#b4a49d);--line:light-dark(#ece4e0,#33261f);--card:light-dark(#faf6f4,#211714);--red:#a3201c;--red2:light-dark(#a3201c,#e0574f);--gold:#e8b23a;--ok:light-dark(#1d7a46,#5fd08f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:920px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,14px) 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.05;margin:0;font-weight:800}
h1 span{color:var(--red2)}
.sub{color:var(--mut);font-size:14px}
.player{background:var(--red);color:#fff;border-radius:22px;padding:clamp(18px,3vw,28px);box-shadow:0 18px 40px -22px #a3201c99;position:relative;overflow:hidden}
.player::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#ffffff22,transparent 70%)}
.ptop{display:flex;justify-content:space-between;gap:10px;font-size:14px;opacity:.9;flex-wrap:wrap}
.ptop b{color:var(--gold);font-weight:700}
.big{min-height:150px;display:flex;flex-direction:column;justify-content:center;padding:14px 0}
.vi{font-size:clamp(36px,8vw,64px);font-weight:800;line-height:1.08;text-wrap:balance}
.en{font-size:clamp(17px,3vw,22px);opacity:.88;margin-top:6px}
.rail{height:6px;background:#ffffff33;border-radius:9px;overflow:hidden;cursor:pointer}
.rail i{display:block;height:100%;width:0;background:var(--gold)}
.times{display:flex;justify-content:space-between;font-size:13px;opacity:.8;margin-top:6px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;min-height:44px;padding:0 18px}
button:focus-visible,.pk:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ctrls button{background:#ffffff22;color:#fff;font-weight:600}
.ctrls .play{width:64px;height:64px;padding:0;background:#fff;color:var(--red);font-size:24px}
.ctrls .on{background:var(--gold);color:#3a2300}
.tabs{display:flex;gap:6px;margin:22px 0 12px}
.tabs button{background:var(--card);color:var(--ink);font-weight:600;border:1px solid var(--line)}
.tabs .sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:6px}
.w{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);min-height:44px}
.w .n{color:var(--mut);font-size:13px;width:1.6em;flex:none}
.w .v{font-weight:700}.w .e{color:var(--mut);font-size:14px}
.w.cur{border-color:var(--red2);box-shadow:inset 4px 0 0 var(--red2)}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px)}
.qhead{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;gap:8px;flex-wrap:wrap}
.qprompt{font-size:clamp(26px,5vw,40px);font-weight:800;margin:14px 0 4px;line-height:1.1;text-wrap:balance}
.qhint{color:var(--mut);font-size:14px;margin-bottom:14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;font-size:17px;font-weight:600;min-height:56px}
.opt.right{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--red2);color:var(--red2);text-decoration:line-through}
.qbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--red);color:#fff;font-weight:700}
.btn2{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.score{font-size:clamp(40px,9vw,72px);font-weight:800;line-height:1;color:var(--red2)}
.miss{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.miss li{padding:6px 0;border-bottom:1px solid var(--line)}
h2{font-size:20px;margin:34px 0 10px}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit}
.pk small{color:var(--mut);font-size:13px}.pk b{font-size:15px;line-height:1.25}
.pk .best{color:var(--ok);font-size:13px;font-weight:600}
.pk.sel{background:var(--red);border-color:var(--red);color:#fff}.pk.sel small,.pk.sel .best{color:#ffe3a6}
@media(prefers-reduced-motion:no-preference){.big{transition:opacity .2s}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Vietnamese <span>1000</span></h1><div class="sub">50 packs · 20 words each · English, then Vietnamese twice</div></header>

<section class="player" aria-label="Player">
  <div class="ptop"><span id="pnum">Pack 1 of 50</span><b id="ptitle"></b></div>
  <div class="big" id="big"><div class="vi" id="bvi">Press play</div><div class="en" id="ben">Tap a word below to jump to it</div></div>
  <div class="rail" id="rail"><i id="fill"></i></div>
  <div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
  <div class="ctrls">
    <button id="prev" aria-label="Previous pack">‹ Prev</button>
    <button id="play" class="play" aria-label="Play">▶</button>
    <button id="next" aria-label="Next pack">Next ›</button>
  </div>
  <div class="ctrls">
    <button id="rep" class="on" aria-pressed="true">Repeat pack: on</button>
    <button id="spd">Speed 1×</button>
  </div>
</section>

<div class="tabs" role="tablist">
  <button id="tWords" class="sel" role="tab">Words</button>
  <button id="tQuiz" role="tab">Quiz</button>
</div>
<div id="words" class="list"></div>
<div id="quiz" class="quiz" hidden></div>

<h2>All packs</h2>
<div class="packs" id="packs"></div>
</div>

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const au=$('au');
let pack=Math.min(49,Math.max(0,store.get('pack',0))), rep=store.get('rep',true), speeds=[1,0.85,0.7], si=0, cur=-1, segEnd=null, tab='words';
const best=store.get('best',{});
const fmt=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';

function renderPacks(){
  $('packs').innerHTML=D.map((w,i)=>`<button class="pk${i===pack?' sel':''}" data-p="${i}"><small>Pack ${i+1}</small><b>${esc(T[i])}</b>${best[i]!=null?`<span class="best">Best quiz: ${best[i]}/20</span>`:''}</button>`).join('');
}
function renderWords(){
  $('words').innerHTML=D[pack].map((w,i)=>`<button class="w${i===cur?' cur':''}" data-i="${i}"><span class="n">${i+1}</span><span><span class="v">${esc(w[1])}</span><br><span class="e">${esc(w[0])}</span></span></button>`).join('');
}
function setPack(p,autoplay){
  pack=(p+50)%50; store.set('pack',pack); cur=-1; segEnd=null;
  au.src=src(pack); au.loop=rep; au.playbackRate=speeds[si];
  $('pnum').textContent=`Pack ${pack+1} of 50`; $('ptitle').textContent=T[pack];
  $('bvi').textContent='Press play'; $('ben').textContent='Tap a word below to jump to it';
  renderWords(); renderPacks(); if(tab==='quiz') startQuiz();
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:`Pack ${pack+1}: ${T[pack]}`,artist:'Vietnamese 1000'})}catch(e){}}
  if(autoplay) au.play().catch(()=>{});
}
function showWord(i){
  if(i===cur) return; cur=i; const w=D[pack][i];
  $('bvi').textContent=w?w[1]:''; $('ben').textContent=w?w[0]:'';
  document.querySelectorAll('.w').forEach((b,k)=>b.classList.toggle('cur',k===i));
}
au.addEventListener('timeupdate',()=>{
  const t=au.currentTime, d=au.duration;
  $('fill').style.width=(d?t/d*100:0)+'%'; $('tcur').textContent=fmt(t); $('tdur').textContent=fmt(d);
  if(segEnd!=null) return;
  const ws=D[pack]; let i=0; while(i+1<ws.length&&ws[i+1][2]<=t+0.05) i++; showWord(i);
});
au.addEventListener('play',()=>{$('play').textContent='❚❚';$('play').setAttribute('aria-label','Pause')});
au.addEventListener('pause',()=>{$('play').textContent='▶';$('play').setAttribute('aria-label','Play')});
au.addEventListener('ended',()=>{if(!rep) setPack(pack+1,true)});
$('play').onclick=()=>{segEnd=null; au.paused?au.play().catch(()=>{}):au.pause()};
$('prev').onclick=()=>setPack(pack-1,!au.paused);
$('next').onclick=()=>setPack(pack+1,!au.paused);
$('rep').onclick=()=>{rep=!rep;au.loop=rep;store.set('rep',rep);syncRep()};
function syncRep(){$('rep').classList.toggle('on',rep);$('rep').setAttribute('aria-pressed',rep);$('rep').textContent=rep?'Repeat pack: on':'Repeat off: plays next pack'}
$('spd').onclick=()=>{si=(si+1)%speeds.length;au.playbackRate=speeds[si];$('spd').textContent=`Speed ${speeds[si]}×`};
$('rail').onclick=e=>{const r=$('rail').getBoundingClientRect();if(au.duration){segEnd=null;au.currentTime=(e.clientX-r.left)/r.width*au.duration}};
$('words').onclick=e=>{const b=e.target.closest('.w');if(!b)return;segEnd=null;au.currentTime=D[pack][+b.dataset.i][2];showWord(+b.dataset.i);au.play().catch(()=>{})};
$('packs').onclick=e=>{const b=e.target.closest('.pk');if(!b)return;setPack(+b.dataset.p,!au.paused);window.scrollTo({top:0,behavior:'smooth'})};

/* play just the Vietnamese of one word */
function sayVi(i){
  const w=D[pack][i]; segEnd=w[4]+0.1; au.loop=false; au.currentTime=w[3]; au.play().catch(()=>{});
  const tick=()=>{if(segEnd==null)return; if(au.currentTime>=segEnd||au.paused){au.pause();segEnd=null;au.loop=rep;return} requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}

/* quiz */
let Q=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(mode,only){
  au.pause();
  mode=mode||(Q&&Q.mode)||'listen';
  const idx=only&&only.length?only:shuffle([...Array(20).keys()]);
  Q={mode,order:shuffle(idx),n:0,score:0,miss:[],done:false,total:idx.length,full:!(only&&only.length)};
  drawQ();
}
function drawQ(){
  const q=$('quiz');
  if(Q.n>=Q.order.length){
    if(Q.full){const p=best[pack];if(p==null||Q.score>p){best[pack]=Q.score;store.set('best',best);renderPacks()}}
    q.innerHTML=`<div class="qhead"><span>Pack ${pack+1} quiz</span><span>${Q.mode==='listen'?'Listening':'Reading'}</span></div>
      <div class="score" style="margin-top:14px">${Q.score}/${Q.total}</div>
      <div class="qhint">${Q.score===Q.total?'Perfect. Try the other quiz type, or move to the next pack.':'Words to work on:'}</div>
      ${Q.miss.length?`<ul class="miss">${Q.miss.map(i=>`<li><b>${esc(D[pack][i][1])}</b> · ${esc(D[pack][i][0])}</li>`).join('')}</ul>`:''}
      <div class="qbar">${Q.miss.length?'<button class="btn" id="qRetry">Retry mistakes</button>':''}<button class="btn2" id="qAgain">New quiz</button><button class="btn2" id="qSwap">Switch to ${Q.mode==='listen'?'reading':'listening'}</button>${pack<49?'<button class="btn2" id="qNext">Next pack</button>':''}</div>`;
    const m=Q.miss.slice();
    if($('qRetry'))$('qRetry').onclick=()=>startQuiz(Q.mode,m);
    $('qAgain').onclick=()=>startQuiz(Q.mode);
    $('qSwap').onclick=()=>startQuiz(Q.mode==='listen'?'read':'listen');
    if($('qNext'))$('qNext').onclick=()=>setPack(pack+1,false);
    return;
  }
  const i=Q.order[Q.n], w=D[pack][i];
  const wrong=shuffle([...Array(20).keys()].filter(k=>k!==i)).slice(0,3);
  const opts=shuffle([i,...wrong]);
  const listen=Q.mode==='listen';
  q.innerHTML=`<div class="qhead"><span>Question ${Q.n+1} of ${Q.order.length} · Score ${Q.score}</span><span>${listen?'Listening: hear it, pick the meaning':'Reading: pick the Vietnamese'}</span></div>
    <div class="qprompt">${listen?'🔊 Listen':esc(w[0])}</div>
    <div class="qhint">${listen?'Tap Play again to hear it once more.':'Tap your answer, then listen to check.'}</div>
    <div class="opts">${opts.map(k=>`<button class="opt" data-k="${k}">${esc(listen?D[pack][k][0]:D[pack][k][1])}</button>`).join('')}</div>
    <div class="qbar"><button class="btn2" id="qSay">${listen?'▶ Play again':'▶ Hear it'}</button><button class="btn" id="qGo" hidden>Next ›</button>
    <button class="btn2" id="qMode">${listen?'Switch to reading':'Switch to listening'}</button></div>`;
  $('qSay').onclick=()=>sayVi(i);
  $('qMode').onclick=()=>startQuiz(listen?'read':'listen');
  if(listen) sayVi(i); else $('qSay').hidden=true;
  let answered=false;
  q.querySelector('.opts').onclick=e=>{
    const b=e.target.closest('.opt'); if(!b||answered) return; answered=true;
    const k=+b.dataset.k;
    if(k===i) Q.score++; else {b.classList.add('wrong');Q.miss.push(i)}
    q.querySelector(`.opt[data-k="${i}"]`).classList.add('right');
    q.querySelector('.qhint').textContent=`${w[1]} = ${w[0]}`;
    $('qSay').hidden=false; $('qSay').textContent='▶ Hear it'; sayVi(i);
    $('qGo').hidden=false; $('qGo').focus();
    $('qGo').onclick=()=>{Q.n++;drawQ()};
  };
}
function setTab(t){
  tab=t; $('tWords').classList.toggle('sel',t==='words'); $('tQuiz').classList.toggle('sel',t==='quiz');
  $('words').hidden=t!=='words'; $('quiz').hidden=t!=='quiz';
  if(t==='quiz') startQuiz(); else if(Q){segEnd=null;au.loop=rep}
}
$('tWords').onclick=()=>setTab('words');
$('tQuiz').onclick=()=>setTab('quiz');
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.key===' ')return;if(e.key===' '&&tab==='words'){e.preventDefault();$('play').click()}});
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('nexttrack',()=>setPack(pack+1,true));navigator.mediaSession.setActionHandler('previoustrack',()=>setPack(pack-1,true))}catch(e){}}
syncRep(); setPack(pack,false);
}
</script>
</body>
</html>
